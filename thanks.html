<title>Message Sent — Two Plasma Studios</title>
<style>
:root{color-scheme:dark;--bg:#080910;--card:#111421;--text:#f5f6ff;--muted:#a9aec2;--line:#292d3d;--purple:#8b7cff;--cyan:#55dcff}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(circle at 20% 10%,#29205277,transparent 35%),radial-gradient(circle at 85% 20%,#123b4b55,transparent 30%),var(--bg);color:var(--text);font:16px/1.65 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(760px,calc(100% - 28px));margin:auto}
main{min-height:100%;display:grid;place-items:center;padding:30px 0}.card{padding:42px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,#ffffff0a,#ffffff03);text-align:center;box-shadow:0 35px 100px #0008}.icon{width:78px;height:78px;margin:0 auto 22px;border-radius:24px;display:grid;place-items:center;font-size:2rem;background:linear-gradient(135deg,#55dfa344,#8b7cff33);border:1px solid #55dfa355}.eyebrow{display:inline-block;padding:6px 11px;border-radius:999px;background:#55dfa312;border:1px solid #55dfa344;color:#a9f2d0;font-size:.82rem}.card h1{font-size:clamp(2.4rem,6vw,4.5rem);line-height:.98;letter-spacing:-.055em;margin:20px 0 14px}.card p{color:var(--muted);max-width:580px;margin:0 auto}.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 17px;border-radius:12px;border:1px solid var(--line);font-weight:750;background:#ffffff06}.primary{background:linear-gradient(135deg,#8272ff,#6554e8);border-color:transparent}.small{margin-top:20px;font-size:.84rem;color:#737b91}
@media(max-width:500px){.card{padding:28px 21px}}
</style>
</head>
<body>
<main><div class="wrap"><section class="card">

</section></div></main>
